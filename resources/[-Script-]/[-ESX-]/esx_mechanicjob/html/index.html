<body>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="js/main.js"></script>

    <div class="ui">
        <div class="container">
            <div class="main p-2 text-center">
                <h2 class="header" style="letter-spacing: 5px; font-size: 130%;">เมนูช่าง</h2>
                <div class="content">

                    <div class="action" data-action="identity_card">
                        <div class="label">ตรวจบัตรประชาชน</div>
                        <div class="icon"><i class="fas fa-users"></i> 
                        </div>
                    </div>
					
					<div class="action" data-action="hij">
                        <div class="label">งัดรถ</div>
                        <div class="icon"><i class="fas fa-car-on"></i></div>
                    </div>
					
                    <div class="action" data-action="repair">
                        <div class="label">ซ่อมรถ</div>
                        <div class="icon"><i class="fas fa-screwdriver-wrench"></i></div>
                    </div>
					
                    <div class="action" data-action="wash">
                        <div class="label">ล้างรถ</div>
                        <div class="icon"><i class="fas fa-wand-magic-sparkles"></i></div>
                    </div>
					
					<div class="action" data-action="fine">
                        <div class="label">บิลค่าซ่อม</div>
                        <div class="icon"><i class="fas fa-file-lines"></i></div>
                    </div>
					
					<div class="action" data-action="remove">
                        <div class="label">ลบรถ</div>
                        <div class="icon"><i class="fas fa-car-tunnel"></i></div>
                    </div>
					
					<div class="action" data-action="AnnouceMC">
                        <div class="label">ประกาศช่าง</div>
                        <div class="icon"><i class="fas fa-bullhorn"></i></div>
                    </div>
					
					<!-- <div class="action" data-action="boss_menu"> -->
                        <!-- <div class="label">เมนูผู้อำนวยการ</div> -->
                        <!-- <div class="icon"><i class="fas fa-user-gear"></i></div> -->
                    <!-- </div> -->

                </div>
                <h5 class="click" style=" letter-spacing: 2px;font-size: 100%;"><i class="fas fa-mouse-pointer"></i> คลิกเลือกเมนูที่</h5>
            </div>
		</div>
    </div>

    <!-- [BOOTSTRAP] -->
