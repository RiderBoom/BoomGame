<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="css/main.css">

    <link href="https://fonts.googleapis.com/css2?family=Mitr&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">

    <!-- [BOOTSTRAP] -->
    <script src="https://kit.fontawesome.com/34f81f36fb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href = "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>

<body>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="js/main.js"></script>

    <div class="ui">
        <div class="container">
            <div class="main p-2 text-center">
                <h2 class="header" style="letter-spacing: 5px; font-size: 130%;">เมนูสภา</h2>
                <div class="content">

                    <div class="action" data-action="identity_card">
                        <div class="label">ตรวจบัตรประชาชน</div>
                        <div class="icon"><i class="fas fa-users"></i> 
                        </div>
                    </div>
					
					<div class="action" data-action="canCarry">
                        <div class="label">อุ้ม</div>
                        <div class="icon"><i class="fas fa-people-arrows"></i></div>
                    </div>
					
                    <div class="action" data-action="body_search">
                        <div class="label">ค้นกระเป๋า</div>
                        <div class="icon"><i class="fas fa-suitcase"></i></div>
                    </div>
					
                    <div class="action" data-action="handcuff">
                        <div class="label">ใส่กุญแจมือ</div>
                        <div class="icon"><i class="fas fa-user-lock"></i></div>
                    </div>
					
                    <div class="action" data-action="unhandcuff">
                        <div class="label">ถอดกุญแจมือ</div>
                        <div class="icon"><i class="fas fa-unlock"></i></div>
                    </div>
					
                    <div class="action" data-action="drag">
                        <div class="label">จับ</div>
                        <div class="icon"><i class="fas fa-handcuffs"></i></div>
                    </div>
					
                    <div class="action" data-action="put_in_vehicle">
                        <div class="label">ใส่เข้าไปในรถ</div>
                        <div class="icon"><i class="fas fa-car"></i></div>
                    </div>
					
                    <div class="action" data-action="out_the_vehicle">
                        <div class="label">เอาออกจากรถ</div>
                        <div class="icon"><i class="fas fa-car"></i></div>
                    </div>
					
					<div class="action" data-action="anm_council">
                        <div class="label">ประกาศสภา</div>
                        <div class="icon"><i class="fas fa-bullhorn"></i></div>
                    </div>
					
					 <div class="action" data-action="fine">
                        <div class="label">บิล</div>
                        <div class="icon"><i class="fas fa-clipboard-list"></i></div>
                    </div> 

                </div>
                <h5 class="click" style=" letter-spacing: 2px;font-size: 100%;"><i class="fas fa-mouse-pointer"></i> คลิกเลือกเมนูที่</h5>
            </div>
		</div>
    </div>

    <!-- [BOOTSTRAP] -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" integrity="sha512-HK5fgLBL+xu6dm/Ii3z4xhlSUyZgTT9tuc/hSrtw6uzJOvgRr2a9jyxxT1ely+B+xFAmJKVSTbpM/CuL7qxO8w==" crossorigin="anonymous" />
</body>

</html>
